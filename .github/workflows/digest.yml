name: digest

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar
  cancel-in-progress: false
  queue: max

jobs:
  digest:
    uses: ./.github/workflows/cycle.yml
    with:
      trigger: digest
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
