name: poll

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes (best effort)
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: radar      # shared with the digest so two runs never write state at once
  cancel-in-progress: false
  queue: max

jobs:
  poll:
    uses: ./.github/workflows/cycle.yml
    with:
      trigger: poll
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
