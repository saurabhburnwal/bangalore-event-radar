name: poll

on:
  schedule:
    - cron: "4-59/10 * * * *"   # every 10 minutes (GitHub may start scheduled runs a few minutes late)
  workflow_dispatch:

permissions:
  contents: write   # to commit state/seen.json back

concurrency:
  group: radar      # shared with the digest so two runs never write state at once
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check sources and alert
        run: python -m radar run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        run: |
          git config user.name "event-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then echo "state unchanged"; exit 0; fi
          git commit -q -m "state: poll [skip ci]"
          git pull -q --rebase
          git push -q
