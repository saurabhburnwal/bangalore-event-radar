forms that development teams actually want to use: golden paths, self-service infrastructure, policy as code, and treating the platform as a product.\n🚀 **Forward Deployed Engineering (FDE)**\nWhat happens when engineers work directly with customers. We’ll talk about taking AI and cloud native systems from prototype to production in messy real-world settings, and what that work teaches you about building software.\n🧩 **Internal Developer Platforms (IDP)**\nHow teams build and scale IDPs: portals, service catalogs, developer experience, and measuring whether the platform is helping.\n\n**Agenda**\n\n* Welcome and introductions from the organizers\n* Technical sessions (speakers to be announced)\n* Lunch and networking with speakers and peers, hosted by HPE\n\n**Who should attend**\nPlatform engineers, DevOps and SREs, security engineers, AI/ML engineers, developers, and engineering leaders working with Kubernetes, cloud native tooling, or AI in production.\n\n**Want to speak?**\nWe’re looking for practitioners to share real-world stories on these topics. Submit at [https://sessionize.com/ksug-in](https://sessionize.com/ksug-in)\n📍 **Venue:** Hewlett Packard Enterprise, Sy No.192, Whitefield Road, B Narayanapura, Mahadevapura, Bengaluru, Karnataka 560048 ([Map](https://maps.app.goo.gl/rCLtb5zR2uYdbHR77))\n📝 **Register:** [ksug.ai/in-12](https://ksug.ai/in-12)\n💬 **Stay updated:** [Discord](https://discord.com/invite/Rp9WzYyKua) · [WhatsApp](https://chat.whatsapp.com/LqmMwMtg14k4sOYmwrD2wz)\n*By registering, you agree to KSUG.AI’s [Privacy Policy](https://ksug.ai/privacy). Sponsors may contact you.*", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/collabnix/events/317107073/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:36951118"}, "socialProofInsights": null, "rsvps": {"totalCount": 168}, "series": null, "venue": {"__typename": "Venue", "name": "IWF Campus - Bengaluru", on, building AI agents on enterprise data, or curious about where the stack is heading, come compare notes with fellow engineers, architects, and open-source contributors.\n\n## ​Call for Presentations\n\n​Want to speak? **[Submit a talk through our CFP](https://docs.google.com/forms/d/e/1FAIpQLScLxl1TXsNLSGcFzq9VPfrg0xGmAhtwnAoviKQDNkuW5CyEbw/viewform?utm_source=luma).**\n​We're looking for two technical talks and one lightning talk on open lakehouses and AI. Share real use cases, production lessons, or new work. **No sales pitches.**\n\n## ​What to expect\n\n* ​**Talks with substance** — four sessions covering open lakehouses and AI, with room for architecture decisions, production lessons, and the details that make an idea work.\n* ​**Lightning rounds** — three short talks to share a fresh idea, a useful technique, or a hard-earned lesson.\n* ​**Breakfast & good company** — start with a bite, meet fellow builders, and leave time for the conversations between sessions.\n* ​**Your voice in the lineup** — two full-length talks and one lightning talk will be selected through our open CFP.\n\n​**Technical, specific, and useful. No sales pitches or product commercials.**\n\n***\n\n## ​Agenda\n\n​*All times are in India Standard Time (IST).*\n\n* ​**9:30–10:00 AM \\| Doors Open & Breakfast**\nGrab breakfast, settle in, and meet the community.\n* ​**10:00–10:30 AM \\| Opening Keynote · Talk \\#1**\n* ​**10:30–11:00 AM \\| Talk \\#2 · Cloudera**\n* ​**11:00–11:30 AM \\| Community Talk \\#3 · Selected through CFP**\n* ​**11:30 AM–12:00 PM \\| Community Talk \\#4 · Selected through CFP**\n* ​**12:00–12:45 PM \\| Lightning Talks**\nThree talks, including one selected through CFP.\n* ​**12:45–1:30 PM \\| Social\\, Networking & Goodbyes**\nKeep the conversation going, swap ideas, and make a few new connections.\n\n​*Speaker names and talk titles will be announced as the lineup is confirmed.*\n\n***\n\n## ​About [PuppyGraph](http://puppygraph.com/?utm_source=luma)\n\n​PuppyGraph is the first and only real time, zero-ETL graph query engine in the market, empowering companies to transform existing relational data stores into a unified graph model in under 10 minutes, bypassing traditional graph databases' cost, latency, and maintenance hurdles.\n​💬 Join [PuppyGraph Community Slack](https://join.slack.com/t/puppygraph-community/shared_invite/zt-251pa4vde-viEpNZcNifxRch9En5Eu7g?utm_source=luma)\n​📚 Check out [PuppyGraph Engineering Blog](https://www.puppygraph.com/blog?utm_source=luma)\n​📲 Follow PuppyGraph on [LinkedIn](https://www.linkedin.com/company/puppygraph?utm_source=luma) & [Twitter](https://x.com/puppyquery?utm_source=luma)\n​🖥️ Subscribe to [PuppyGraph YouTube](https://www.youtube.com/@PuppyGraph?utm_source=luma)\n​💾 Download [PuppyGraph Forever Free Developer Edition](https://www.puppygraph.com/download-confirmation?utm_source=luma) (no form & no payment required)\n\n***\n\n## ​**About** **[Cloudera](https://www.cloudera.com/?utm_source=luma)**\n\n​Cloudera is the only hybrid data and AI platform company that large organizations trust to bring AI to their data anywhere it lives. Unlike other providers, Cloudera delivers a consistent cloud experience that converges public clouds, on-prem data centers, sovereign clouds, and the edge, leveraging a proven open-source foundation. As the pioneer in big data, Cloudera empowers businesses to apply AI and assert control over 100% of their data, in all forms, improving security, governance, and real-time and predictive insights.\n\n***\n\n## ​ About **[OLake](https://olake.io/?utm_source=luma)**\n\n​OLake, is **Iceberg-native ingestion, built for speed and reliability.** It is the fastest and most reliable way to bring operational database data into your data lakehouse with Apache Iceberg. From high-volume CDC pipelines to handling schema evolution and large documents, OLake is designed to make ingestion simple, cost-efficient, and production-ready.\n​As an Iceberg-native, open-source first project, we’re proud to contribute back to the community and to make it easier for data teams everywhere to adopt Iceberg in production.\n​**Get started today:**\n​📲 [OLake Quickstart Guide](https://olake.io/docs/getting-started/quickstart?utm_source=luma)\n🖥️ [OLake on GitHub](https://github.com/datazip-inc/olake?utm_source=luma)\n📚 [OLake Documentation](https://olake.io/docs?utm_source=luma)\n💬 [OLake Community Slack](https://join.slack.com/t/getolake/shared_invite/zt-3dm246v3l-yCHwxKchDU6GkhJ4ZegwAA?utm_source=luma)\n\n***\n\n## ​About [VeloDB](https://www.velodb.io/?utm_source=luma)\n\n​VeloDB (Powered by Apache Doris) is the fastest analytics and search database for the AI era, designed for:\n\n* ​High-concurrency, low-latency OLAP for customer-facing, agent-facing, and hybrid search scenarios\n* ​A real-time lakehouse query engine on Apache Iceberg\n* ​The most cost-effective AI observability solution\n\n​📚 Learn more about [Apache Doris](http://doris.apache.org/?utm_source=luma)\n​💬 Join the [Doris Slack Channel](https://join.slack.com/t/apachedoriscommunity/shared_invite/zt-35mzao67o-BrpU70FNKPyB6UlgpXf8_w?utm_source=luma)\n​📚 Follow VeloDB on [LinkedIn](https://www.linkedin.com/company/velodb?utm_source=luma)\n​☁️ Try [VeloDB Cloud](https://www.velodb.io/get-started?utm_source=luma) for Free", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/futureofdata-bangalore/events/317087004/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:19690748"}, "socialProofInsights": null, "rsvps": {"totalCount": 97}, "series": null, "venue": {"__typename": "Venue", "name": "Cloudera", "address": "3rd Floor, No. 6/B, Summit, 80 Feet Rd, Koramangala 1A Block, Koramangala 3 Block, Koramangala, Bengaluru, Karnataka 560034, Ind", "city": "Bengaluru", "state": "KA", "country": "in"}}, "Group:38589867": {"__typename": "Group", "id": "38589867", "name": "AWS SBG at East Point College of En
