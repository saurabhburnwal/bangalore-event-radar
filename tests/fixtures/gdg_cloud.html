ent_type_title": "External registration", "is_conference": false, "start_date": "2026-10-24T04:00:00Z", "title": "Road to Devfest: Opensource Edition", "url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-road-to-devfest-opensource-edition/", "title_translated": null, "description_translated": null, "description_short_translated": null}, {"allows_cohosting": false, "chapter_id": 351, "cohost_registration_url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-cloud-amp-data-day/", "cropped_banner_url": "https://res.cloudinary.com/startup-grind/image/upload/c_scale,w_2560/c_crop,h_640,w_2560,y_0.0_mul_h_sub_0.0_mul_640/c_crop,h_640,w_2560/c_fill,dpr_2.0,f_auto,g_center,q_auto:good/v1/gcs/platform-data-goog/event_banners/blob_AYtxJPq", "cropped_picture_url": "https://res.cloudinary.com/startup-grind/image/upload/c_fill,w_500,h_500,g_center/c_fill,dpr_2.0,f_auto,g_center,q_auto:good/v1/gcs/platform-data-goog/events/blob_fR8A3XU", "description": "<p>Join <strong>GDG Cloud Bengaluru</strong> and <strong>MongoDB</strong> for <strong>Cloud &amp; Data Day</strong>—an intensive, half-day developer workshop designed to equip you with modern cloud database strategies, vector search capabilities, and hands-on architectural skills.</p><p>Whether you are building intelligent AI applications or scaling real-time distributed data pipelines, this event brings together industry experts and live coding sessions to level up your engineering stack.</p><h2>What to Expect</h2><ul><li><p><strong>2 Technical Hands-On Workshops:</strong> Step-by-step guided lab sessions covering database architecture, search indexing, and cloud integrations.</p></li><li><p><strong>100% Practical Focus:</strong> Bring your laptop and build alongside MongoDB Solutions Architects &amp; Google Cloud experts.</p></li><li><p><strong>Networking &amp; Lunch:</strong> Connect with fellow software engineers, data architects, and cloud practitioners over lunch.</p></li></ul><h2>🕒 Agenda</h2><ul><li><p><strong>09:30 AM – 10:00 AM:</strong> Check-in &amp; Morning Networking</p></li><li><p><strong>10:00 AM – 11:30 AM:</strong> <strong>Workshop 1: MongoDB Workshop</strong></p></li><li><p><strong>11:30 AM – 11:45 AM:</strong> Networking &amp; Refreshment Break</p></li><li><p><strong>11:45 AM – 01:15 PM:</strong> <strong>Workshop 2: Google Cloud Workshop</strong></p></li><li><p><strong>01:15 PM – 02:30 PM:</strong> Networking Lunch &amp; Closing</p></li></ul><p><br></p><p>Session details:</p><p>MongoDB Workshop:&nbsp;</p><p><span style=\"\">Title: Search, Understand, Remember: MongoDB Vector Search for Agentic AI</span></p><p>Abstract: Modern AI applications need to understand their data rather than query them with exact keywords. In this 90-minute session, you'll journey from MongoDB's flexible document model to the mechanics of Vector Search: how embeddings work, how similarity search runs natively alongside your operational data, and why that convergence matters. We'll close by exploring MongoDB as the unified data and memory layer powering agentic AI applications. Walk away with a working mental model of semantic search and the opportunity to earn the MongoDB Vector Search Fundamentals skill badge.</p><p><br></p><p>Google Cloud Workshop:</p><p>Title: Connect to Remote Agents with ADK and the Agent2Agent (A2A) SDK</p><p>Abstract: This session introduces the Agent2Agent (A2A) protocol and demonstrates how AI agents can communicate and collaborate across different systems. You will learn how to set up the Agent Development Kit (ADK), deploy an ADK agent as an A2A server, create an Agent Card describing its capabilities, and connect another agent to it as a sub-agent. The session provides hands-on experience with agent discovery, standardized communication, and building interoperable multi-agent systems.</p><p><br></p><h2>💻 Prerequisites &amp; Preparation</h2><ol><li><p><strong>Bring a fully charged laptop</strong> (and charger).</p></li><li><p>A active Google Cloud / MongoDB Atlas free-tier account (setup instructions will be sent prior to the event).</p></li><li><p>Basic familiarity with any backend programming language (Python, Node.js, Java, or C++).</p><p><br></p><p><br></p><p>Fill the form to express interest.</p></li></ol>", "description_short": "GDG Cloud Bangalore and MongoDB Collaboration", "event_type_title": "External registration", "is_conference": false, "start_date": "2026-08-22T04:00:00Z", "title": "Cloud & Data Day", "url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-cloud-amp-data-day/", "title_translated": null, "description_translated": null, "description_short_translated": null}, {"allows_cohosting": false, "chapter_id": 351, "cohost_registration_url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-cloud-under-the-hood/", "cropped_banner_url": "https://res.cloudinary.com/startup-grind/image/upload/c_scale,w_2560/c_crop,h_640,w_2560,y_0.0_mul_h_sub_0.0_mul_640/c_crop,h_640,w_2560/c_fill,dpr_2.0,f_auto,g_center,q_auto:good/v1/gcs/platform-data-goog/event_banners/blob_h3t79ZK", "cropped_picture_url": "https://res.cloudinary.com/startup-grind/image/upload/c_fill,w_500,h_500,g_center/c_fill,dpr_2.0,f_auto,g_center,q_auto:good/v1/gcs/platform-data-goog/events/blob_Vi2D0c3", "description": "<p>As cloud architectures mature, engineering teams face a new reality: managing complex distributed systems at scale without skyrocketing costs or security blind spots. Join GDG Cloud Bengaluru to go beyond the basics of cloud hosting and dive into production-hardened Google Cloud engineering - from high-performance container orchestration to resilient data infrastructure.</p><p>Date: 4th July, 2026</p><p>Time: 9:30 AM to 2:30 PM IST</p><p>Location: Nasdaq Headquarters India (<a href=\"https://maps.app.goo.gl/wYqBDNwZqPiAvVRc7\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">https://maps.app.goo.gl/wYqBDNwZqPiAvVRc7</a>)</p><p>What to Expect:</p><p>Next-Gen Infrastructure: Deep dives into modern GKE, platform engineering automation, and managing high-throughput workloads.</p><p>Architecture Under the Hood: Real-world engineering strategies for building fault-tolerant, secure, and cost-optimized cloud platforms.</p><p>Production-Grade Data Pipelines: Moving, processing, and analyzing massive data streams across GCP environments with minimal latency.</p><p>Network &amp; Community: Connect with local cloud architects, engineers, and SREs solving complex scalability challenges in production.</p><p>Agenda:</p><p>09:30 AM – 10:00 AM: Arrivals and settle-in</p><p>10:00 AM – 10:15 AM: Welcome and Introductions</p><p>10:15 AM – 10:45 AM:&nbsp;Era of Production Agent Engineering with Google Cloud Agent Platform</p><p>10:45 AM – 11:15 AM:  Chatting with Your Data: Conversational Analytics in BigQuery</p><p>11:15 AM – 11:30 AM: Fun Quiz</p><p>11:30 AM – 12:00 PM: From Alerts to Actions: Building Autonomous Incident Response Agents on Google Cloud </p><p>12:00 PM – 12:30 PM: GKE agent sandbox: AI helping developers deploy!</p><p>12:30 PM – 02:00 PM: Networking / Lunch</p><p>Session details: </p><p>Talk 1: </p><p><strong>Era of Production Agent Engineering with Google Cloud Agent Platform by Abhishek Sharma</strong></p><p>Description: <em>The novelty of AI chat interfaces has passed, we have officially entered the era of Agent Engineering. For enterprises the challenge has shifted from Can we build it? to How do we make it reliable, secure, and scalable for production? In this session, we will explore the transition from experimental AI prototypes to robust, agentic assembly lines. Where, I will guide audience through the architectural requirements for production-ready agents, focusing on how Google Cloud’s Agent Platform addresses the enterprise bottleneck, the gap between a working demo and a resilient system with the help of different solutions like ADK, Agent Engine, MCP Servers, Agent registry, Model Armor, Memory Bank, Agent Identity &amp; Evaluation.</em></p><p></p><p>Talk 2: <strong>Chatting with Your Data: Conversational Analytics in BigQuery by Aryan Irani</strong></p><p>Description:<em> We are officially moving past the era of static dashboards and into the era of \"Agent-Scale Analytics.\" In this session, you will learn how to unlock the power of Conversational Analytics in BigQuery to query your enterprise data using natural language. Through live technical demonstrations, we will explore how to build secure, governed AI agents from scratch using Dataplex glossaries and Verified Queries to execute complex, multi-table SQL seamlessly and accurately</em></p><p></p><p>Talk 3: <strong>From Alerts to Actions: Building Autonomous Incident Response Agents on Google Cloud by Jitendra Gupta</strong></p><p>Description: <em>Modern cloud environments generate thousands of alerts every day, leaving SRE and operations teams overwhelmed by monitoring dashboards, incident investigations, and manual remediation tasks. While observability platforms help identify issues, the path from alert to resolution often remains heavily dependent on human intervention.<br>In this session, we’ll explore how Agentic AI is transforming Site Reliability Engineering by enabling autonomous incident response on Google Cloud. Using Gemini, Agent Development Kit (ADK), Model Context Protocol (MCP), Cloud Operations Suite, and GKE, we’ll demonstrate how intelligent agents can detect anomalies, correlate telemetry signals, identify root causes, execute runbooks, and automate remediation workflows.<br>Through a real-world production scenario, attendees will learn how to design and implement AI-powered operational agents that reduce Mean Time to Detect (MTTD), accelerate Mean Time to Resolve (MTTR), and improve overall system reliability. Whether you’re an SRE, DevOps Engineer, Platform Engineer, or Cloud Architect, this session will provide practical insights into building the next generation of intelligent, self-healing cloud operations</em></p><p>Talk 4: <strong>GKE agent sandbox: AI helping developers deploy! by Pratik Singh</strong></p><p><em>Deploying on Kubernetes shouldn't mean wrestling with complex YAML or risking security on untrusted, AI-generated code.</em></p><p><em>This talk introduces how </em><strong><em>GKE Agent Sandbox</em></strong><em> and the </em><strong><em>GKE MCP server</em></strong><em> solve both problems. Discover how gVisor-isolated cells securely contain experimental workloads by default, keeping your network safe. Meanwhile, an AI assistant handles deployment, status checks, and logs through plain-English conversation—completely eliminating </em><code>kubectl</code><em>.</em></p><p><em>We’ll demonstrate taking a Python script from local edit to a live, securely isolated deployment on GKE using a simple chat interface. Focus on your code; let the cluster handle the rest.</em></p><p>Register <a href=\"https://forms.gle/HXKU7umnPhzeip4C6\" rel=\"noopener noreferrer nofollow\" target=\"_blank\">here</a></p>", "description_short": "Dive deep into production-hardened Google Cloud engineering, high-performance GKE, and resilient architecture at scale this July 4th at Nasdaq.", "event_type_title": "External registration", "is_conference": false, "start_date": "2026-07-04T04:00:00Z", "title": "Cloud Under the Hood", "url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-cloud-under-the-hood/", "title_translated": null, "description_translated": null, "description_short_translated": null}, {"allows_cohosting": false, "chapter_id": 351, "cohost_registration_url": "https://gdg.community.dev/events/details/google-gdg-cloud-bengaluru-presents-deployfest/", "cropped_banner_url": "https://res.cloudinary.com/startup-grind/image/upload/c_scale,w_2560/c_crop,h_640,w_2560,y_0.0_mul_h_sub_0.0_mul_640/c_crop,h_640,w_2560/c_fill,dpr_2.0,f_auto,g_center,q_auto:good/v1/gcs/platform-data-goog/event_banne
