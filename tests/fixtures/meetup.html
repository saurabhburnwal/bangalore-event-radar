7250308"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-online"}}, "Group:19690748": {"__typename": "Group", "id": "19690748", "name": "Future of Data: Bangalore", "urlname": "futureofdata-bangalore", "timezone": "Asia/Kolkata", "keyGroupPhoto": {"__ref": "PhotoInfo:512552989"}, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.59, "totalRatings": 387}}}, "Event:317058082": {"__typename": "Event", "id": "317058082", "title": "LLMOps in Production: Observability, Evals & Guardrails", "dateTime": "2026-11-21T09:30:00+05:30", "description": "Moving Large Language Models from prototype to production isn't just about prompt engineering—it’s about Observability, Evals, Safety, Alignment, and Governance.\n\nJoin the Future of Data Bangalore developer community for an in-person, technical deep-dive into building production-grade LLM applications. Host & Community Partners Cloudera, Vivanti, and Globalsinc are bringing together AI engineers, ML platform architects, and open-source contributors across Bangalore to share real-world engineering strategies.\n\n## **📍 Event Details**\n\n* **Date: Saturday, 21st November 2026**\n* **Time: 9:30 AM – 2:00 PM IST**\n* **Host: Cloudera**\n* **Partners: Cloudera + Vivanti + Globalsinc**\n\n## **🗓️ Agenda & Schedule**\n\n9:30AM to 10:00AM: Registration & Welcome Coffee\n10:00AM to 10:30AM: Keynote & Community Intro\n10:30AM to 11:00AM: Talk 1 TBD\n11:00AM to 11:30AM: Talk 2 TBD\n11:30AM to 12:00PM: Talk 3 TBD\n12:00PM to 12:30PM: Panel Discussion: Real-world LLMOps pitfalls & Successes\n12:30PM to 12:45PM: Q&A\n01:00PM to 2:00PM: Lunch & Networking\n\n## **🎯 Core Discussion Topics**\n\nWhether you are fighting prompt drift, setting up eval pipelines, or implementing guardrails before your next release, our sessions focus on four core pillars:\n\n1. Observability & Tracing: Tracking prompt trajectories, token costs, latency, and context degradation across multi-step chains.\n2. Evals & Benchmarking: Automated scoring pipelines, synthetic test datasets, and continuous evaluations in production.\n3. Guardrails & Safety: Enforcing real-time input/output sanitization, schema validation, and PII detection.\n4. Governance & Alignment: Auditing model behaviors, maintaining compliance, and managing model versions across environments.\n\n## **🤝 Community & Support**\n\nA massive shoutout to Cloudera for hosting us and providing lunch, as well as Vivanti and Globalsinc for partnering with us to support the local developer ecosystem.\n\n**⚠️ Important Note: In-person seats are limited to ensure a quality networking experience. Please RSVP early to secure your spot!**", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/futureofdata-bangalore/events/317058082/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:19690748"}, "socialProofInsights": null, "rsvps": {"totalCount": 369}, "series": null, "venue": {"__typename": "Venue", "name": "Cloudera", "address": "3rd Floor, No. 6/B, Summit, 80 Feet Rd, Koramangala 1A Block, Koramangala 3 Block, Koramangala, Bengaluru, Karnataka 560034, Ind", "city": "Bengaluru", "state": "KA", "country": "in"}}, "RecommendedEventsEdge:{\"node\":{\"id\":\"317058082\"}}": {"__typename": "RecommendedEventsEdge", "node": {"__ref": "Event:317058082", "id": "317058082"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-offline"}}, "Group:38040475": {"__typename": "Group", "id": "38040475", "name": "AI XCHANGE - Meetup Group", "urlname": "ai-xchange", "timezone": "Asia/Kolkata", "keyGroupPhoto": {"__ref": "PhotoInfo:528236132"}, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.63, "totalRatings": 226}}}, "Event:316920742": {"__typename": "Event", "id": "316920742", "title": "KSUG.AI India #12 meetup @ HPE", "dateTime": "2026-11-21T09:00:00+05:30", "description": "**One-Click to register now =>** [KSUG.AI/events/ksug-in-12](https://ksug.ai/discount?tab=events&event=ksug-in-12&ref=meetup) **<=**\nWe're excited to invite you to [KSUG.AI](https://ksug.ai/) India #12 meetup **@ [HPE](https://www.hpe.com/)**. in collaboration with AI XCHANGE , Collabnix & HPE\n\n**📅 Event Agenda**\n\n* Welcome / Introductions by the Organizers @**[KSUG.AI](https://ksug.ai/?ref=luma)**\n* **Topic 1**: Is One Network Enough? Breaking Kubernetes' Single-Interface Assumption by [Fazlur Rahman Khan](https://www.linkedin.com/in/fazlur-rahman-khan/), Principal Technologist and Technical Trainer @ **The Linux Foundation**\n* **Topic 2**: What If Your APIs Could Talk to AI Agents by [Anand Kaliappan](https://www.linkedin.com/in/anand-kaliappan-ai-solutions-architect/), AI Solution Architect @ **[HPE](https://www.hpe.com/)**\n* **Topic 3**: Surviving Resource Starvation: Pod Priority & Preemption in Production Kubernetes by [Jayachandra Reddy Majjiga](https://www.linkedin.com/in/jayachandrareddy-majjiga/), Sr. Platform Engineer @ **EPAM Systems**\n* **Topic 4**: Sandboxing AI Agents on Kubernetes: Picking the Right Wall by [Raveendiran RR](https://www.linkedin.com/in/raveendiranrr/), Community Leader @ **Collabnix**\n* **Topic 5**: Accelerated AI & HPC Platform by [Sharath Kumar HM](https://www.linkedin.com/in/sharath-kumar-hiremat/), HPC & AI Infrastructure Architect @ **[HPE](https://www.hpe.com/)**\n* **Topic 6**: Trust the Box, Not the Agent: Sandboxing Coding Agents from Laptop to Cloud by [Ajeet Raina](https://www.linkedin.com/in/ajeetsraina/), Developer Advocate @ **Docker**\n* **Networking & Lunch**, Connect with speakers, co-hosts, and peers over lunch courtesy of **[HPE](https://www.hpe.com/)**!\n\n**Location:** **[Hewlett Packard Enterprise](https://maps.app.goo.gl/rCLtb5zR2uYdbHR77)**\nSy No.192, Whitefield Road, B Narayanapura,\nMahadevapura, Bengaluru, Karnataka 560048\n\n*By registering, you consent to the management of your personal information in accordance with [KSUG.AI](https://ksug.ai/?ref=luma)'s [Privacy Policy](https://ksug.ai/privacy). Additionally, you agree that our sponsors may contact you.*\n\n**For any help or clarification please connect me in** [Linkedin](https://www.linkedin.com/in/premgoswami07/).\nAlso follow **[AI XCHANGE](https://www.linkedin.com/company/107499745/)** for further updates.", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/ai-xchange/events/316920742/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:38040475"}, "socialProofInsights": null, "rsvps": {"totalCount": 449}, "series": null, "venue": {"__typename": "Venue", "name": "Hewlett Packard Enterprise", "address": "Sy No.192, Whitefield Road, B Narayanapura, Mahadevapura, Bengaluru, Karnataka 560048, India", "city": "Bengaluru", "state": "KA", "country": "in"}}, "RecommendedEventsEdge:{\"node\":{\"id\":\"316920742\"}}": {"__typename": "RecommendedEventsEdge", "node": {"__ref": "Event:316920742", "id": "316920742"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-offline"}}, "Event:317087004": {"__typename": "Event", "id": "317087004", "title": "​Open Lakehouse & AI", "dateTime": "2026-11-28T09:30:00+05:30", "description": "**Register HERE: https://luma.com/puppyg-rz8o**\n(Registration will be considered only through above link)\n\n📍 Bangalore · 4th Floor, Essae Vaishnavi Summit (No. 6/B), 7th Main, 80 Feet Road, 3rd Block, Koramangala Industrial Layout\n🗓️ Saturday\\, November 28\\, 2026 \\| 9:30 AM–1:30 PM IST\n☕ Doors open & breakfast at 9:30 AM · Talks kick off at 10:00 AM\n💥 Free to attend\n\n## ​Bangalore, let's talk data.\n\n​Bring your production stories, your architecture questions, and your appetite. We're getting the open lakehouse and AI community together for a Saturday morning of technical talks, lightning rounds, and the conversations that keep going after the slides are done.\n​Co-hosted by **PuppyGraph, Cloudera, OLake, and VeloDB**, Future of Data brings together the people building data platforms and putting AI to work.\n​Whether you're running Iceberg in production, building AI agents on enterprise data, or curious about where the stack is heading, come compare notes with fellow engineers, architects, and open-source contributors.\n\n## ​Call for Presentations\n\n​Want to speak? **[Submit a talk through our CFP](https://docs.google.com/forms/d/e/1FAIpQLScLxl1TXsNLSGcFzq9VPfrg0xGmAhtwnAoviKQDNkuW5CyEbw/viewform?utm_source=luma).**\n​We're looking for two technical talks and one lightning talk on open lakehouses and AI. Share real use cases, production lessons, or new work. **No sales pitches.**\n\n## ​What to expect\n\n* ​**Talks with substance** — four sessions covering open lakehouses and AI, with room for architecture decisions, production lessons, and the details that make an idea work.\n* ​**Lightning rounds** — three short talks to share a fresh idea, a useful technique, or a hard-earned lesson.\n* ​**Breakfast & good company** — start with a bite, meet fellow builders, and leave time for the conversations between sessions.\n* ​**Your voice in the lineup** — two full-length talks and one lightning talk will be selected through our open CFP.\n\n​**Technical, specific, and useful. No sales pitches or product commercials.**\n\n***\n\n## ​Agenda\n\n​*All times are in India Standard Time (IST).*\n\n* ​**9:30–10:00 AM \\| Doors Open & Breakfast**\nGrab breakfast, settle in, and meet the community.\n* ​**10:00–10:30 AM \\| Opening Keynote · Talk \\#1**\n* ​**10:30–11:00 AM \\| Talk \\#2 · Cloudera**\n* ​**11:00–11:30 AM \\| Community Talk \\#3 · Selected through CFP**\n* ​**11:30 AM–12:00 PM \\| Community Talk \\#4 · Selected through CFP**\n* ​**12:00–12:45 PM \\| Lightning Talks**\nThree talks, including one selected through CFP.\n* ​**12:45–1:30 PM \\| Social\\, Networking & Goodbyes**\nKeep the conversation going, swap ideas, and make a few new connections.\n\n​*Speaker names and talk titles will be announced as the lineup is confirmed.*\n\n***\n\n## ​About [PuppyGraph](http://puppygraph.com/?utm_source=luma)\n\n​PuppyGraph is the first and only real time, zero-ETL graph query engine in the market, empowering companies to transform existing relational data stores into a unified graph model in under 10 minutes, bypassing traditional graph databases' cost, latency, and maintenance hurdles.\n​💬 Join [PuppyGraph Community Slack](https://join.slack.com/t/puppygraph-community/shared_invite/zt-251pa4vde-viEpNZcNifxRch9En5Eu7g?utm_source=luma)\n​📚 Check out [PuppyGraph Engineering Blog](https://www.puppygraph.com/blog?utm_source=luma)\n​📲 Follow PuppyGraph on [LinkedIn](https://www.linkedin.com/company/puppygraph?utm_source=luma) & [Twitter](https://x.com/puppyquery?utm_source=luma)\n​🖥️ Subscribe to [PuppyGraph YouTube](https://www.youtube.com/@PuppyGraph?utm_source=luma)\n​💾 Download [PuppyGraph Forever Free Developer Edition](https://www.puppygraph.com/download-confirmation?utm_source=luma) (no form & no payment required)\n\n***\n\n## ​**About** **[Cloudera](https://www.cloudera.com/?utm_source=luma)**\n\n​Cloudera is the only hybrid data and AI platform company that large organizations trust to bring AI to their data anywhere it lives. Unlike other providers, Cloudera delivers a consistent cloud experience that converges public clouds, on-prem data centers, sovereign clouds, and the edge, leveraging a proven open-source foundation. As the pioneer in big data, Cloudera empowers businesses to apply AI and assert control over 100% of their data, in all forms, improving security, governance, and real-time and predictive insights.\n\n***\n\n## ​ About **[OLake](https://olake.io/?utm_source=luma)**\n\n​OLake, is **Iceberg-native ingestion, built for speed and reliability.** It is the fastest and most reliable way to bring operational database data into your data lakehouse with Apache Iceberg. From high-volume CDC pipelines to handling schema evolution and large documents, OLake is designed to make ingestion simple, cost-efficient, and production-ready.\n​As an Iceberg-native, open-source first project, we’re proud to contribute back to the community and to make it easier for data teams everywhere to adopt Iceberg in production.\n​**Get started today:**\n​📲 [OLake Quickstart Guide](https://olake.io/docs/getting-started/quickstart?utm_source=luma)\n🖥️ [OLake on GitHub](https://github.com/datazip-inc/olake?utm_source=luma)\n📚 [OLake Documentation](https://olake.io/docs?utm_source=luma)\n💬 [OLake Community Slack](https://join.slack.com/t/getolake/shared_invite/zt-3dm246v3l-yCHwxKchDU6GkhJ4ZegwAA?utm_source=luma)\n\n***\n\n## ​About [VeloDB](https://www.velodb.io/?utm_source=luma)\n\n​VeloDB (Powered by Apache Doris) is the fastest analytics and search database for the AI era, designed for:\n\n* ​High-concurrency, low-latency OLAP for customer-facing, agent-facing, and hybrid search scenarios\n* ​A real-time lakehouse query engine on Apache Iceberg\n* ​The most cost-effective AI observability solution\n\n​📚 Learn more about [Apache Doris](http://doris.apache.org/?utm_source=luma)\n​💬 Join the [Doris Slack Channel](https://join.slack.com/t/apachedoriscommunity/shared_invite/zt-35mzao67o-BrpU70FNKPyB6UlgpXf8_w?utm_source=luma)\n​📚 Follow VeloDB on [LinkedIn](https://www.linkedin.com/company/velodb?utm_source=luma)\n​☁️ Try [VeloDB Cloud](https://www.velodb.io/get-started?utm_source=luma) for Free", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/futureofdata-bangalore/events/317087004/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:19690748"}, "socialProofInsights": null, " ntic AI Community Bengaluru", "urlname": "agentic-ai-community-bengaluru", "timezone": "Asia/Kolkata", "keyGroupPhoto": {"__ref": "PhotoInfo:529470757"}, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.54, "totalRatings": 102}}}, "Event:316972361": {"__typename": "Event", "id": "316972361", "title": "Agent Builders Community Day Bengaluru", "dateTime": "2026-11-21T08:30:00+05:30", "description": "A process that already works is about to get rebuilt - live, from the ground up, into a working AI agent.\nOne stage. One story. Zero fluff.\nYou won't just watch a demo. You'll watch the whole journey, from a real business problem to a fully working agent, unfold in real time, built by the people who actually do this for a living.\n**WHAT YOU'LL WITNESS**\nA business leader brings a real process. A solution consultant spots the opportunity. An architect designs the rebuild. A developer builds it live...\nThen we zoom out: what's next for UiPath, real customer wins, how to actually get ROI from AI, and a celebration of Bengaluru's own builder community.\nThis is a working day, not a sit-and-watch day.\n**📚 Agenda [WIP]**\n***8:15 AM – 9:15 AM Registration, Networking & Breakfast***\n9:15 AM – 9:45 AM Welcome & Kickoff\n9:45 AM – 10:00 AM The Process \\| enterprise context\\, the ambition to go further\n10:00 AM – 10:35 AM The Opportunity \\| reimagining it from a technology lens\n10:50 AM – 11:35 AM The Solution Design \\| solution architecture\\, live\n11:35 AM – 12:15 PM The Build \\| live build \\+ demo \\[UiPath For Coding Agents\\]\n12:15 PM – 12:30 PM The Payoff \\| value realized\\, projected impact\n***12:30 PM – 2:00 PM Lunch & Networking***\n2:15 PM – 2:45 PM UiPath Ecosystem Update \\| new announcements & releases \\[UiPath Cartographer \\| UiPath Delegate \\| UiPath Maestro Automate\\]\n2:45 PM – 3:15 PM Customer Showcases\n3:15 PM – 3:45 PM Cracking ROI from AI\n3:45 PM – 4:15 PM Community Celebration \\| Awards & Champion Stories\n***4:15 PM – 4:30 PM Wrap-Up & Closing Networking***\n\n**WHO SHOULD BE IN THE ROOM**\nBuilders. Developers. Architects. AI and Automation Professionals\n***📌This event is not designed and relevant for students and its prepared keeping automation and AI professionals in mind!!!***\n**SEATS ARE LIMITED. ONE HALL. NO PARALLEL SESSIONS.**\nThis is the whole room, watching the whole story, together.\nDont miss out on this ;) Limited seats!!! Register Now!!!", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/agentic-ai-community-bengaluru/events/316972361/", "isAttending": false, "isSaved": false, "maxTickets": 0, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:38074541"}, "socialProofInsights": null, "rsvps": {"totalCount": 267}, "series": null, "venue": {"__typename": "Venue", "name": "Jawaharlal Nehru Planetarium", "address": "Sri T, Sankey Rd, High Grounds, Bengaluru, Karnataka 560001, India", "city": "Bengaluru", "state": "KA", "country": "in"}}, "RecommendedEventsEdge:{\"node\":{\"id\":\"316972361\"}}": {"__typename": "RecommendedEventsEdge", "node": {"__ref": "Event:316972361", "id": "316972361"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-offline"}}, "Group:36951118": {"__typename": "Group", "id": "36951118", "name": "Collabnix - DevOps | Cloud-Native | Agentic AI", "urlname": "collabnix", "timezone": "Asia/Kolkata", "keyGroupPhoto": {"__ref": "PhotoInfo:511413387"}, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.53, "totalRatings": 689}}}, "Event:317107073": {"__typename": "Event", "id": "317107073", "title": "Open Posibilities Unlocked @HPE", "dateTime": "2026-11-21T09:00:00+05:30", "description": "Collabnix, KSUG.AI, and Hewlett Packard Enterprise are hosting an in-person meetup in Bengaluru for engineers who build and run cloud native and AI sy o do, please UNRSVP and help others attend\n\nFollow us o[n Twitt](http://twitter.com/__bangpypers__)er an[d FaceBo](https://www.facebook.com/bangpypers/)ok. Join our discussion i[n Disco](https://discord.gg/Tnhbqh33zd)rd an[d Mailing Li](https://mail.python.org/mailman/listinfo/bangpypers)st. Read about past meetup in th[e bl](https://bangalore.pythonindia.org/)og", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/bangpypers/events/312819340/", "isSaved": false, "maxTickets": 200, "rsvpState": "JOIN_OPEN", "feeSettings": null, "socialProofInsights": null, "rsvps": {"totalCount": 116}, "series": {"__typename": "Series", "description": "Every 3rd Saturday of the month until April 10, 2027", "weeklyRecurrence": null, "monthlyRecurrence": {"__typename": "MonthlyRecurrenceInfo", "monthlyDayOfWeek": "SATURDAY", "monthlyWeekOfMonth": 3}, "events({\"numberOfEvents\":5,\"startDate\":\"2026-11-10\"})": {"__typename": "SeriesEventConnection", "edges": [{"__typename": "EventEdge", "node": {"__ref": "Event:312819340"}}, {"__typename": "EventEdge", "node": {"__ref": "Event:312819341"}}, {"__typename": "EventEdge", "node": {"__ref": "Event:315439158"}}, {"__typename": "EventEdge", "node": {"__ref": "Event:315439159"}}, {"__typename": "EventEdge", "node": {"__ref": "Event:315439160"}}]}}, "venue": {"__typename": "Venue", "name": "Automation Anywhere Software Pvt Ltd", "address": "12th, Prestige Trade Tower, 45/1, Palace Rd, High Grounds, Sampangi Rama Nagar, Bengaluru, Karnataka 560001, India", "city": "Bengaluru", "state": "KA", "country": "in"}}, "Event:312819341": {"__typename": "Event", "id": "312819341", "dateTime": "2026-12-19T10:30:00+05:30", "isAttending": false, "group": {"__typename": "Group", "urlname": "bangpypers"}}, "Event:315439158": {"__typename": "Event", "id": "315439158", "dateTime": "2027-01-16T10:30:00+05:30", "isAttending": false, "group": {"__typename": "Group", "urlname": "bangpypers"}}, "Event:315439159": {"__typename": "Event", "id": "315439159", "dateTime": "2027-02-20T10:30:00+05:30", "isAttending": false, "group": {"__typename": "Group", "urlname": "bangpypers"}}, "Event:315439160": {"__typename": "Event", "id": "315439160", "dateTime": "2027-03-20T10:30:00+05:30", "isAttending": false, "group": {"__typename": "Group", "urlname": "bangpypers"}}, "RecommendedEventsEdge:{\"node\":{\"id\":\"312819340\"}}": {"__typename": "RecommendedEventsEdge", "node": {"__ref": "Event:312819340", "id": "312819340"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-offline"}}, "Group:20130377": {"__typename": "Group", "id": "20130377", "name": "Polyglot Languages & Runtimes (Java, Cloud & AI...)", "urlname": "polyglot-languages-runtimes-java-jvm-nodejs-swift", "timezone": "Asia/Kolkata", "keyGroupPhoto": null, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.68, "totalRatings": 359}}}, "Event:317201934": {"__typename": "Event", "id": "317201934", "title": "[in-person] Polyglot day: Inferring AI", "dateTime": "2026-11-21T11:00:00+05:30", "description": "The Polyglot Meetup has been fostering a strong and dynamic community of developers, over the last 10 years!\nExcited to welcome you to our rung 2 in-person meetup of 2026! our highlight this time is learning through community engagement with new session recipe!\nWe will go length and breadth of AI and Java with expert-led talks covering Transformers, Agentic AI, AI-enabled content generation, and the evolving business landscape surrounding Java licensing. Let us together learn what are the advances in AI, and how they are influencing software engineering and redefining the way organizations innovate.\n\n**THIS IS A FREE EVENT! BUT PRIOR REGISTRATION IS MANDATORY**\n**Please [Register here](https://forms.gle/sPfxb2FgHgPXVrBW8)**\nEvent Date :- 21st Nov 2026\nReporting Time: 10.30 AM\nSession Time :- 11.00 AM to 4.00 PM\nLocation :\nIBM EGL D Block, 3rd floor, Multipurpose hall\nEmbassy Golf Links, Off IndiraNagar-Koramangala Intermediate Ring Road,\nBengaluru, Karnataka 560071\nMap : https://maps.app.goo.gl/qQU2MHAUP5ZeNvtz7\n\nTrack 1 :- 11.00 AM to 11.40 AM\nTea break & Networking :- 11.40 AM to 11.50 AM\nTrack 2 :- 11.55 AM to 1:00 PM\n**Lunch Break :- 1.00 PM to 1.40 PM ( Lunch will be arranged )**\nTrack 3 :- 1.45 PM to 3:30 PM\nTea Break & Networking :- 3.30 PM to 4:00 PM\n\n**[keynote]** **Transformers : The ABCD of Modern AI**\n**Speaker** **: Vibha Marpalle**\nEvery conversation about modern AI starts in the same place: the Transformer. it is how models hold context, stay coherent and power nearly every serious AI system today. So lets skip the surface tour and plunge in. Self-attention, positional encoding and encoder-decoder design: lets take each one apart, then put them back together to see how they turn raw tokens into meaning.\n\n**Agentic AI for Java: Root Cause Analysis, Code Fixes, and Validation**\n**Speaker : Dinakar Guniguntala**\nDebugging a Java application in production is only half the battle. Identifying the root cause is valuable, but translating that insight into a code change, implementing the fix, and validating the result is what ultimately resolves the problem.\nThis session explores how Agentic AI can connect these traditionally separate activities through an integrated developer workflow. We will introduce Causa, an open-source AI-powered root cause analysis tool for Java applications, and demonstrate how it can work alongside an AI coding assistant to accelerate production troubleshooting and remediation.\nUsing quarkus-perf, a Quarkus application designed for performance testing and controlled failure scenarios, we will trigger a runtime problem and investigate it using Causa. The demo will show how runtime and application evidence can guide root cause analysis, how your AI powered IDE (Bob, Claude etc) can help a developer navigate the relevant source code and implement a targeted fix, and how the change can be tested to verify its impact.\nAlong the way, we will examine the roles of specialized AI agents, observability data, tool integration through MCP, and human oversight in this workflow. The goal is to explore a practical approach to AI-assisted Java engineering that connects production diagnostics with code-level problem solving, while keeping developers in control of the decisions and changes that matter.\n\n**When AI Becomes Your Technical Writer: Engineering Trustworthy AI Content Pipelines**\n**Speaker : Manisha Choudhary**\nGenerative AI is transforming how engineering teams create technical documentation, tutorials, presentations, and onboarding materials, but fluent output does not guarantee technical accuracy. This talk explores how AI-assisted content generation evolves from ad-hoc prompting into a governed, testable engineering pipeline. Through practical examples, we will examine failure modes such as hallucinations, terminology inconsistencies, and prompt regressions, and demonstrate controls including retrieval-assisted generation, automated validation, quality evaluation, and human-in-the-loop review.\n\n**Modern AI: reflect, challenge and reinvent!**\n**Speaker : Gireesh Punathil**\nIn 2011, IBM Watson beat Jeopardy champions with a pipeline of hand-built components on a dedicated cluster. Today, a single, rented, general-purpose model can do far more. lets trace how the premises of AI shifted in fifteen years, from architecture and cost to adoption and governance. We will then challenge the assumptions shaping today's systems and explore what is ripe for reinvention - because the history shows that anything we build today will look primitive tomorrow! You will leave with one question: which of today's designs are laws, and which are waiting to break? And perhaps, a fresh perspective, a radical idea or the seed of your AI innovation! Come with energy. Be curious and challenge everything. Lets learn together!\n\n**Java Licensing & Why It Matters**\n**Speaker : Suman Mitra**\nJoin this session for a quick overview of how Java licensing has evolved over the years, the current Java distribution landscape, and what organizations should consider when choosing a JDK. We'll compare popular Java distributions, their licensing models & support options", "eventType": "PHYSICAL", "eventUrl": "https://www.meetup.com/polyglot-languages-runtimes-java-jvm-nodejs-swift/events/317201934/", "isAttending": false, "isSaved": false, "maxTickets": 100, "rsvpState": "JOIN_OPEN", "feeSettings": null, "group": {"__ref": "Group:20130377"}, "socialProofInsights": null, "rsvps": {"totalCount": 91}, "series": null, "venue": {"__typename": "Venue", "name": "IBM EGL D Block", "address": "IBM Ln", "city": "Bengaluru", "state": "Ka", "country": "in"}}, "RecommendedEventsEdge:{\"node\":{\"id\":\"317201934\"}}": {"__typename": "RecommendedEventsEdge", "node": {"__ref": "Event:317201934", "id": "317201934"}, "metadata": {"__typename": "SearchMetadata", "recId": "e3b26710-0478-472e-ae46-d8b3a1cff325", "recSource": "ml-popular-events-nearby-offline"}}, "Group:38386415": {"__typename": "Group", "id": "38386415", "name": "Confidential Computing Bangalore Community", "urlname": "confidential-computing-bangalore-community", "timezone": "Asia/Kolkata", "keyGroupPhoto": {"__ref": "PhotoInfo:535351824"}, "stats": {"__typename": "GroupStats", "eventRatings": {"__typename": "GroupStatsEventRatings", "average": 4.7, "totalRatings": 20}}}, "Event:317101247": {"__typename": "Event", "id": "317101247", "title": "The Zero-Trust Enclave: Securing Clusters, Workloads, and Citizen Data", "dateTime": "2026-12-05T09:00:00+05:30", "description": "At this year-end meetup, we advance our confidential computing journey through sessions on building confidentiality for cloud native clusters and nodes, safeguarding citizen data privacy, establishing a hardware-verified trust framework, and mediating host-guest interactions inside secure enclaves.\n\nWe begin by examining the critical role of confidential computing architectures in securing Kubernetes clusters and nodes followed by a session on unlocking data for the public good without compromising individual privacy.\n\nFurthermore, we will explore how hardware-rooted Secure Execution TEEs isolate container runtimes to mitigate insider threats. We will also learn how paravisors decouple hardware primitives from the guest kernel to streamline enterprise-grade deployments.\n\nWe will conclude the meetup with a dialogue between the attendees, the panel of all speakers and distinguished guests to tie together the day's discussions, clarify audience queries and identify opportunities for community collaboration.\n\n**The Agenda:**\n\n**09:00 AM: Registration Open/Coffee**\n\n**09:30 AM: Opening Remarks**\nGiridhar Ramaraju - Senior Director & Center Head - Red Hat Bangalore\n\n**09:40 AM: Trusted Execution Clusters - An Overview**\nNitesh Narayan Lal - Engineering Manager, Red Hat\nChirag Rao - Software Engineer, Red Hat\n\n**10:30 AM: Privacy Preserving Data Processing and Exchange - Future of Data DPI**\nRohith Vaidyanathan, Lead - Confidential Computing, Center of Data for Public Good, IISc\n\n**11:15 AM: Tea/Coffee/Snacks Break**\n\n**11:30 AM: Protecting Secrets in Confidential Containers with Secure Execution**\nAjay Victor - Software Engineer, IBM Confidential Computing Containers for Red Hat OpenShift\nRohit Singh - Software Engineer, IBM Confidential Computing Containers for Red Hat OpenShift\n\n**12:15 PM: Demystifying the Paravisor: Building the Security Bridge for Confidential VMs**\nMayank Kumar, Software Engineer 2, Microsoft\n\n**01:00 PM: Connecting the Dots**\nDialogue between speakers, guests and audience\n\n**01:30 PM: Wrap Up**\n\n**Venue:**\nRed Hat Bangalore Office\nBagmane Constellation Business Park,\nCarina Building, 10th Floor East,\nDoddanekkundi, Bengaluru, Karnataka 560037\n\nhttps://maps.app.goo.gl/dCKoXJH
